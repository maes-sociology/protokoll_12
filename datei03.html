<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROTOKOLL 12 – DATEI 03</title>
<link rel="stylesheet" href="css/terminal.css?v=10">
</head>
<body>
<main class="terminal">
    <header class="header layer">
        <div>
            <div class="header-title">PROTOKOLL 12 // DATEI 03</div>
            <div class="small">KATEGORIE: BEOBACHTUNG / NETZRECHERCHE</div>
        </div>
        <div class="header-status">KANAL: AKTIV<br>STATUS: VERSCHLÜSSELT</div>
    </header>
    <section id="output" class="output layer" aria-live="polite"></section>
    <div class="controls layer">
        <button id="openBtn" type="button" style="display:none">&gt; DATEI ENTSCHLÜSSELN</button>
    </div>
    <section id="answerPanel" class="answer-panel layer">
        <label id="answerLabel" for="answer"><b>ANTWORT EINGEBEN</b></label>
        <p id="answerHint" class="small"></p>
        <div class="answer-row">
            <input id="answer" type="text" autocomplete="off" placeholder="Antwort">
            <button id="checkBtn" type="button">&gt; PRÜFEN</button>
        </div>
        <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>
    <div class="back-row layer">
        <a href="index.html#archiv" class="terminal-button" data-terminal-link data-file="MISSIONSARCHIV">&lt; ZURÜCK ZUM ARCHIV</a>
    </div>
</main>
<script src="js/terminal.js?v=10"></script>
<script src="js/missions/03.js?v=10"></script>
<script src="js/mission.js?v=10"></script>
</body>
</html>
