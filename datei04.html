<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<title>PROTOKOLL 12 – DATEI 04</title>
<link rel="stylesheet" href="css/terminal.css?v=8">
</head>
<body>
<main class="terminal">
    <header class="header layer">
        <div>
            <div class="header-title">PROTOKOLL 12 // DATEI 04</div>
            <div class="small">KATEGORIE: RECHERCHE / MUSTERERKENNUNG</div>
        </div>
        <div class="header-status">KANAL: AKTIV<br>STATUS: VERSCHLÜSSELT</div>
    </header>

    <section id="output" class="output layer" aria-live="polite"></section>

    <div class="controls layer">
        <button id="openBtn" type="button" style="display:none">&gt; DATEI ENTSCHLÜSSELN</button>
    </div>

    <section id="answerPanel" class="answer-panel layer">
        <label id="answerLabel" for="answer"></label>
        <p id="answerHint" class="small"></p>
        <div class="answer-row">
            <input id="answer" type="text" autocomplete="off">
            <button id="checkBtn" type="button">&gt; PRÜFEN</button>
        </div>
        <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>

    <div class="back-row layer">
        <a href="index.html#archiv" class="terminal-button" data-terminal-link data-file="MISSIONSARCHIV">&lt; ZURÜCK ZUM ARCHIV</a>
    </div>
</main>

<script src="js/terminal.js?v=8"></script>
<script>
window.P12_MISSION = {
    fileId: "datei04",
    fragment: "9",
    bootLines: [
        "DATEI 04 WIRD GELADEN ...", "", "QUELLE: < K_ >",
        "SIGNATUR VERIFIZIERT", "DATENPAKET GEFUNDEN", "",
        "ZUGRIFF ERFORDERT BESTÄTIGUNG"
    ],
    decryptLines: [
        "ENTSCHLÜSSELUNG GESTARTET ...", "PRÜFE DATENINTEGRITÄT",
        "KANAL STABIL", "NACHRICHT FREIGEGEBEN"
    ],
    message: `Die KI sucht nach Adressen.

Menschen erkennen,
dass manche Straßennamen
mehr verraten als Wegbeschreibungen.

Finde heraus,
wo man in Weimar
die Joppie Remoulade
bekommen kann.

Im Namen der Straße
verbirgt sich
ein Sternzeichen.

Finde es.

<span class="signature">&lt; K_ &gt;</span>`,
    stages: [
        {
            label: "STERNZEICHEN EINGEBEN",
            hint: "Welches Sternzeichen verbirgt sich im Namen der Straße?",
            placeholder: "Sternzeichen",
            inputMode: "text",
            maxLength: 12,
            normalizeUmlauts: true,
            answers: ["Schütze", "Schuetze"],
            error: "NICHT BESTÄTIGT. FINDE ZUERST DEN ORT UND UNTERSUCHE DEN NAMEN DER STRASSE.",
            transition: `SCHÜTZE BESTÄTIGT.

Die KI erkennt Wörter.

Menschen erkennen Zusammenhänge.

Der Schütze
ist nicht nur ein Wort.

An welcher Stelle
steht dieses Sternzeichen
im Tierkreis?

Gib die Zahl ein.`
        },
        {
            label: "POSITION IM TIERKREIS EINGEBEN",
            hint: "An welcher Stelle steht der Schütze im Tierkreis?",
            placeholder: "Position",
            inputMode: "numeric",
            maxLength: 2,
            answers: ["9"],
            error: "POSITION NICHT KORREKT. ZÄHLE DIE STERNZEICHEN IN IHRER REIHENFOLGE."
        }
    ],
    successHtml: `RICHTIG.<div class="fragment">FRAGMENT GESICHERT<strong>9</strong></div><span class="signature">&lt; K_ &gt;</span>`
};
</script>
<script src="js/mission.js?v=8"></script>
</body>
</html>
