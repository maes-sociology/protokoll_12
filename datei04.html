<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROTOKOLL 12 – DATEI 04</title>
<link rel="stylesheet" href="css/terminal.css?v=7">
</head>
<body>
<main class="terminal">
    <header class="header layer">
        <div>
            <div class="header-title">PROTOKOLL 12 // DATEI 04</div>
            <div class="small">KATEGORIE: RECHERCHE / MUSTERERKENNUNG</div>
        </div>
        <div class="header-status">KANAL: AKTIV<br>STATUS: VERSCHLÜSSELT</div>
    </header>

    <section id="output" class="output layer" aria-live="polite"></section>

    <div class="controls layer">
        <button id="openBtn" type="button" style="display:none">&gt; DATEI ENTSCHLÜSSELN</button>
    </div>

    <section id="answerPanel" class="answer-panel layer">
        <label id="answerLabel" for="answer"><b>HÖCHSTE PIZZANUMMER EINGEBEN</b></label>
        <p id="answerHint" class="small">Gib die höchste Nummer auf der Speisekarte ein.</p>
        <div class="answer-row">
            <input id="answer" type="text" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="Nummer">
            <button id="checkBtn" type="button">&gt; PRÜFEN</button>
        </div>
        <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>

    <div class="back-row layer">
        <a href="index.html#archiv" class="terminal-button" data-terminal-link data-file="MISSIONSARCHIV">&lt; ZURÜCK ZUM ARCHIV</a>
    </div>
</main>

<script src="js/terminal.js?v=7"></script>
<script>
const output = document.getElementById("output");
const openBtn = document.getElementById("openBtn");
const answerPanel = document.getElementById("answerPanel");
const answer = document.getElementById("answer");
const answerLabel = document.getElementById("answerLabel");
const answerHint = document.getElementById("answerHint");
const checkBtn = document.getElementById("checkBtn");
const feedback = document.getElementById("feedback");

let stage = 1;

const bootLines = [
    "DATEI 04 WIRD GELADEN ...",
    "",
    "QUELLE: < K_ >",
    "SIGNATUR VERIFIZIERT",
    "DATENPAKET GEFUNDEN",
    "",
    "ZUGRIFF ERFORDERT BESTÄTIGUNG"
];

const decryptLines = [
    "ENTSCHLÜSSELUNG GESTARTET ...",
    "PRÜFE DATENINTEGRITÄT",
    "KANAL STABIL",
    "NACHRICHT FREIGEGEBEN"
];

const message = `Die KI kennt Suchmaschinen.

Sie kennt Speisekarten.

Sie kennt Millionen von Einträgen.

Aber sie weiß nicht,
welcher Ort für die Menschen
wirklich der beste ist.

Finde heraus,
wo viele Weimarer sagen,
dass es die beste Pizza der Stadt gibt.

Ein Hinweis:

Der gesuchte Ort liegt direkt
neben einem Eisladen.

Die Speisekarte findest du,
wenn du richtig suchst.

Jede Pizza trägt eine Nummer.

Suche die höchste Nummer.

Gib sie ein.

<span class="signature">&lt; K_ &gt;</span>`;

function prepareStageOne(){
    stage = 1;
    answerLabel.innerHTML = "<b>HÖCHSTE PIZZANUMMER EINGEBEN</b>";
    answerHint.textContent = "Gib die höchste Nummer auf der Speisekarte ein.";
    answer.placeholder = "Nummer";
    answer.maxLength = 8;
    answer.value = "";
    answer.disabled = false;
    checkBtn.disabled = false;
    feedback.className = "feedback";
    feedback.innerHTML = "";
}

function showPuzzleImmediately(){
    prepareStageOne();
    output.innerHTML = message;
    answerPanel.style.display = "block";
    openBtn.style.display = "none";
    answer.focus();
}

openBtn.addEventListener("click", () => {
    openBtn.style.display = "none";
    P12.playSequence(output, decryptLines, () => {
        P12.typeHtml(output, message, () => {
            prepareStageOne();
            answerPanel.style.display = "block";
            answer.focus();
        });
    });
});

function normalize(value){
    return value.trim().replace(/\s+/g, "");
}

function showStageTwo(){
    stage = 2;
    answer.value = "";
    answer.maxLength = 2;
    answer.placeholder = "Quersumme";
    answerLabel.innerHTML = "<b>QUERSUMME EINGEBEN</b>";
    answerHint.textContent = "Addiere die einzelnen Ziffern der bestätigten Nummer.";
    feedback.className = "feedback success";

    const stageTwoMessage = `405 BESTÄTIGT.

Die KI sammelt Zahlen.
Menschen erkennen Zusammenhänge.

Bilde die Quersumme:

4 + 0 + 5 = ?

Gib das Ergebnis ein.`;

    P12.typeHtml(feedback, stageTwoMessage, () => {
        answer.focus();
    }, 18);
}

function solve(){
    P12.markSolved("datei04", "9");
    answer.disabled = true;
    checkBtn.disabled = true;
    feedback.className = "feedback success";
    feedback.innerHTML =
        `RICHTIG.<div class="fragment">FRAGMENT GESICHERT<strong>9</strong></div><span class="signature">&lt; K_ &gt;</span>`;
}

function checkAnswer(){
    const value = normalize(answer.value);

    if(value === ""){
        feedback.className = "feedback error";
        feedback.textContent = "KEINE EINGABE ERKANNT.";
        return;
    }

    if(stage === 1){
        if(value === "405"){
            showStageTwo();
        }else{
            feedback.className = "feedback error";
            feedback.textContent = "NICHT BESTÄTIGT. PRÜFE DIE HÖCHSTE NUMMER AUF DER SPEISEKARTE.";
            answer.select();
        }
        return;
    }

    if(value === "9"){
        solve();
    }else{
        feedback.className = "feedback error";
        feedback.textContent = "QUERSUMME NICHT KORREKT. ADDIERE DIE EINZELNEN ZIFFERN.";
        answer.select();
    }
}

checkBtn.addEventListener("click", checkAnswer);
answer.addEventListener("keydown", event => {
    if(event.key === "Enter") checkAnswer();
});

P12.bindTerminalLinks();

if(P12.isSolved("datei04")){
    const storedFragment = P12.getFragment("datei04") || "9";

    const solvedNote = document.createElement("div");
    solvedNote.className = "fragment layer";
    solvedNote.innerHTML =
        `STATUS: BEREITS ABGESCHLOSSEN – ERNEUTE ANALYSE MÖGLICH
         <strong>${storedFragment}</strong>`;
    document.querySelector(".terminal").insertBefore(
        solvedNote,
        document.querySelector(".back-row")
    );

    showPuzzleImmediately();
}else{
    P12.playSequence(output, bootLines, () => {
        openBtn.textContent = "> DATEI ENTSCHLÜSSELN";
        openBtn.style.display = "inline-block";
    });
}
</script>
</body>
</html>
